# Runs the validation and the tool's own checks on every supported Python version.
# Actions are pinned to the commit of a released version (the version is in the comment).
name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install the two GraphSense environments
        run: uv run gs-zec-validate.py install
      - name: Run the validation
        run: uv run gs-zec-validate.py run
      - name: Tests of the tool (including the end-to-end tests)
        run: uv run --locked pytest
      - name: Lint, format and type checks
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked ty check
      - name: Further layer (GraphSense's transformer)
        run: |
          uv run gs-zec-validate.py install --with-transformer
          uv run gs-zec-validate.py run --with-transformer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-python-${{ matrix.python }}
          path: report/
          if-no-files-found: warn

  # Not required to pass: these platforms could not be tested before publication.
  other-platforms:
    name: ${{ matrix.os }} (informational)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          enable-cache: false
      - run: uv run gs-zec-validate.py install
      - run: uv run gs-zec-validate.py run

  # Later graphsense-lib revisions in the place of 2.16.4 must report the same expected values.
  later-revisions:
    name: after = ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: graphsense-lib 2.17.0
            ref: 2268134ac3d8fdad410071a7c1402c44ae9619b2
          - name: develop after 192 and 193
            ref: e8b6660735b93c61f790f27de9f1abd2599d8d62
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: graphsense/graphsense-lib
          ref: ${{ matrix.ref }}
          path: graphsense-lib
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          enable-cache: false
      - run: uv run gs-zec-validate.py install
      - run: uv run gs-zec-validate.py run --after-src graphsense-lib/src
